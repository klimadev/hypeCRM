    <!-- 10. Preço -->
    <section class="py-24 md:py-32 relative bg-[#09090b] overflow-hidden" id="preco">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(168,85,247,0.16),transparent_38%),radial-gradient(circle_at_bottom_right,rgba(59,130,246,0.08),transparent_28%)] pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
            <div class="max-w-3xl mx-auto text-center mb-10 md:mb-14">
                <p class="inline-flex items-center gap-2 rounded-full border border-violet-500/20 bg-violet-500/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.24em] text-violet-200 mb-5">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    Planos por período e instâncias
                </p>
                <h2 class="text-3xl md:text-5xl font-bold text-white tracking-tight mb-4">Escolha o período ideal para sua operação</h2>
                <p class="text-base md:text-lg text-zinc-400">Equipe inteira sem custo extra, com planos escaláveis por instâncias e cobrança simples.</p>
            </div>

            <div class="max-w-5xl mx-auto">
                <div class="pricing-shell rounded-[2rem] md:rounded-[2.5rem] border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_30px_120px_-40px_rgba(0,0,0,0.9)] overflow-hidden">
                    <div class="px-4 sm:px-6 md:px-8 pt-5 md:pt-7">
                        <div class="inline-flex w-full sm:w-auto rounded-2xl border border-white/10 bg-black/20 p-1 gap-1" role="tablist" aria-label="Selecione o período">
                            <button type="button" class="pricing-period-btn flex-1 sm:flex-none px-4 py-3 rounded-xl text-sm font-semibold text-zinc-300 transition-all duration-300" data-period="mensal" aria-pressed="true">Mensal</button>
                            <button type="button" class="pricing-period-btn flex-1 sm:flex-none px-4 py-3 rounded-xl text-sm font-semibold text-zinc-300 transition-all duration-300" data-period="semestral" aria-pressed="false">Semestral</button>
                            <button type="button" class="pricing-period-btn flex-1 sm:flex-none px-4 py-3 rounded-xl text-sm font-semibold text-zinc-300 transition-all duration-300" data-period="anual" aria-pressed="false">Anual</button>
                        </div>
                    </div>

                    <div class="px-4 sm:px-6 md:px-8 pt-6 md:pt-8 pb-4 md:pb-6">
                        <div class="grid gap-4 md:grid-cols-3" id="pricing-cards" aria-live="polite"></div>
                    </div>

                    <div class="px-4 sm:px-6 md:px-8 pb-6 md:pb-8">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 rounded-3xl border border-white/10 bg-black/20 px-5 py-5">
                            <div class="flex items-start gap-4 text-left">
                                <div class="w-12 h-12 rounded-2xl bg-violet-500/10 border border-violet-500/20 flex items-center justify-center shrink-0">
                                    <i data-lucide="shield-check" class="w-5 h-5 text-violet-300"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-white">Garantia de 7 dias e sem fidelidade</div>
                                    <div class="text-sm text-zinc-400">Você escala quando quiser, sem complicação operacional.</div>
                                </div>
                            </div>
                            <a href="#contato" class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-6 py-3.5 font-semibold text-zinc-950 transition-transform duration-300 hover:-translate-y-0.5 hover:bg-zinc-200 shadow-[0_18px_50px_-18px_rgba(255,255,255,0.45)]">
                                Assinar agora
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        (function () {
            const pricingData = {
                mensal: {
                    periodLabel: '/mês',
                    billingLabel: 'Cobrado mensalmente',
                    accent: 'Mensal',
                    highlight: 'Flexível para começar',
                    plans: [
                        { instances: 1, price: 400, note: 'Para validar a operação com 1 WhatsApp', badge: 'Entrada' },
                        { instances: 2, price: 700, note: 'Melhor equilíbrio para pequenos times', badge: 'Mais escolhido' },
                        { instances: 3, price: 1500, note: 'Estrutura completa para maior volume', badge: 'Mais capacidade' },
                    ],
                },
                semestral: {
                    periodLabel: '/mês',
                    billingLabel: 'Cobrado semestralmente',
                    accent: 'Semestral',
                    highlight: 'Economia mais inteligente',
                    plans: [
                        { instances: 1, price: 250, note: 'Ótimo para operação enxuta e previsível', badge: 'Economia' },
                        { instances: 2, price: 500, note: 'Escala confortável para o dia a dia', badge: 'Mais escolhido' },
                        { instances: 3, price: 1000, note: 'Mais fôlego para tráfego e atendimento', badge: 'Melhor valor' },
                    ],
                },
                anual: {
                    periodLabel: '/mês',
                    billingLabel: 'Cobrado anualmente',
                    accent: 'Anual',
                    highlight: 'Maior economia no compromisso anual',
                    plans: [
                        { instances: 1, price: 190, note: 'Menor custo mensal com previsibilidade', badge: 'Mais econômico', savings: 'Economize mais' },
                        { instances: 2, price: 350, note: 'Ideal para crescimento sustentável', badge: 'Favorito', savings: 'Ótimo custo-benefício' },
                        { instances: 3, price: 750, note: 'Escala máxima com melhor diluição', badge: 'Maior economia', savings: 'Melhor plano anual' },
                    ],
                },
            };

            const formatter = new Intl.NumberFormat('pt-BR');
            const cardsRoot = document.getElementById('pricing-cards');
            const periodButtons = Array.from(document.querySelectorAll('.pricing-period-btn'));
            let currentPeriod = 'anual';

            function moeda(valor) {
                return formatter.format(valor);
            }

            function cardClasses(index, activePeriod) {
                const isFeatured = activePeriod === 'anual' && index === 0;
                return [
                    'pricing-card',
                    'rounded-[1.75rem]',
                    'border',
                    'p-5',
                    'md:p-6',
                    'bg-[linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.03))]',
                    'backdrop-blur-sm',
                    'transition-all',
                    'duration-300',
                    'hover:-translate-y-1',
                    'hover:border-violet-400/35',
                    'hover:shadow-[0_24px_70px_-35px_rgba(168,85,247,0.55)]',
                    isFeatured ? 'ring-1 ring-violet-400/35 shadow-[0_24px_90px_-45px_rgba(168,85,247,0.55)]' : 'border-white/10',
                ].join(' ');
            }

            function renderCards(period) {
                const data = pricingData[period];
                cardsRoot.classList.add('is-updating');
                cardsRoot.innerHTML = data.plans.map((plan, index) => {
                    const featured = period === 'anual' && index === 0;
                    const badge = featured ? 'Melhor escolha' : plan.badge;
                    const savings = plan.savings ? `<span class="inline-flex items-center rounded-full border border-emerald-400/20 bg-emerald-400/10 px-2.5 py-1 text-[11px] font-semibold text-emerald-200">${plan.savings}</span>` : '';

                    return `
                        <article class="${cardClasses(index, period)}">
                            <div class="flex items-start justify-between gap-3 mb-5 min-h-[3rem]">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-[0.24em] text-zinc-400 mb-2">${data.accent}</p>
                                    <h3 class="text-2xl font-bold text-white tracking-tight">${plan.instances} instância${plan.instances > 1 ? 's' : ''}</h3>
                                </div>
                                <span class="inline-flex items-center rounded-full ${featured ? 'bg-violet-500 text-white' : 'bg-white/8 text-zinc-200'} px-3 py-1 text-[11px] font-semibold whitespace-nowrap">${badge}</span>
                            </div>

                            <div class="flex items-end gap-1.5 mb-4">
                                <span class="text-sm font-semibold text-zinc-400 pb-1">R$</span>
                                <span class="text-5xl font-black text-white tracking-tight leading-none">${moeda(plan.price)}</span>
                                <span class="text-sm font-medium text-zinc-400 pb-1">${data.periodLabel}</span>
                            </div>

                            <p class="text-sm text-zinc-400 mb-4 min-h-[3rem]">${plan.note}</p>

                            <div class="space-y-3 mb-5">
                                <div class="flex items-center gap-3 text-sm text-zinc-200">
                                    <span class="flex h-5 w-5 items-center justify-center rounded-full bg-violet-500/10 text-violet-300"><i data-lucide="check" class="w-3.5 h-3.5"></i></span>
                                    Equipe inteira sem custo extra
                                </div>
                                <div class="flex items-center gap-3 text-sm text-zinc-200">
                                    <span class="flex h-5 w-5 items-center justify-center rounded-full bg-violet-500/10 text-violet-300"><i data-lucide="check" class="w-3.5 h-3.5"></i></span>
                                    ${plan.instances} número${plan.instances > 1 ? 's' : ''} / WhatsApp / operação
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-2 mb-5">
                                <span class="inline-flex items-center rounded-full border border-white/10 bg-black/20 px-3 py-1 text-[11px] font-semibold text-zinc-300">${data.billingLabel}</span>
                                ${savings}
                            </div>

                            <a href="#contato" class="mt-auto inline-flex w-full items-center justify-center rounded-2xl bg-white px-4 py-3.5 text-sm font-semibold text-zinc-950 transition-transform duration-300 hover:-translate-y-0.5 hover:bg-zinc-200">
                                Escolher plano
                            </a>
                        </article>
                    `;
                }).join('');

                requestAnimationFrame(() => {
                    cardsRoot.classList.remove('is-updating');
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                });
            }

            function setActivePeriod(period) {
                currentPeriod = period;
                periodButtons.forEach((button) => {
                    const active = button.dataset.period === period;
                    button.classList.toggle('pricing-period-btn--active', active);
                    button.setAttribute('aria-pressed', active ? 'true' : 'false');
                });
                renderCards(period);
            }

            periodButtons.forEach((button) => {
                button.addEventListener('click', () => setActivePeriod(button.dataset.period));
            });

            setActivePeriod(currentPeriod);
        })();
    </script>

    <style>
        .pricing-period-btn--active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.95), rgba(139, 92, 246, 0.7));
            color: #fff;
            box-shadow: 0 12px 30px -18px rgba(168, 85, 247, 0.9);
        }

        .pricing-card {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        #pricing-cards.is-updating {
            opacity: 0.72;
            transform: translateY(2px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        #pricing-cards {
            transition: opacity 180ms ease, transform 180ms ease;
        }

        @media (prefers-reduced-motion: no-preference) {
            .pricing-card {
                animation: pricingFade 220ms ease;
            }

            @keyframes pricingFade {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
