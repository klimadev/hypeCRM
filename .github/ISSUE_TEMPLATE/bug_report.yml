name: Bug Report
description: Report a bug to help us improve
labels: [bug]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, deployment mode
      value: |
        - Browser:
        - OS:
        - Node:
        - Deployment:
